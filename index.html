<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2459c4" />
    <title>SKYBREAK // Stage 1</title>
  </head>
  <body>
    <main id="game-shell" aria-label="SKYBREAK Stage 1">
      <canvas id="render-canvas" aria-label="3Dゲーム画面"></canvas>
      <div id="speed-lines" aria-hidden="true"></div>

      <section id="hud" aria-label="ステージ情報">
        <div class="hud-topline">
          <div class="brand">SKYBREAK<span>01 / AIR DISTRICT</span></div>
          <div class="status-pills">
            <div id="coin-count" class="pill">コイン 0 / 12</div>
            <div id="giant-hp" class="pill danger">巨人 HP 3 / 3</div>
            <button id="quick-retry" class="quick-retry" type="button" aria-label="ステージをリトライ">↻</button>
          </div>
        </div>
        <div class="objective-card">
          <div class="eyebrow">FLIGHT CHECK / はじめの飛行</div>
          <div id="objective">コインを8枚集めて、巨人を倒せ</div>
          <div id="route-readout" class="route-readout">次のコインを探しています…</div>
        </div>
        <div id="anchor-readout" class="anchor-readout">照準アンカーを探しています…</div>
        <div class="flight-gauge"><strong id="speed-readout">0</strong><span>m/s</span><div class="gauge-track"><i id="speed-fill"></i></div></div>
        <div id="message" class="message" role="status"></div>
        <div class="desktop-help">WASD 移動　｜　マウスドラッグ カメラ　｜　Space ワイヤー　｜　Shift ブースト　｜　E 攻撃　｜　R リトライ</div>
      </section>

      <div class="reticle" aria-hidden="true"><span></span></div>

      <section id="touch-ui" aria-label="タッチ操作">
        <div id="stick-zone" class="stick-zone" aria-label="移動スティック">
          <div class="stick-ring"><div id="stick-knob" class="stick-knob"></div></div>
          <span>MOVE</span>
        </div>
        <div class="touch-actions">
          <button id="boost-button" class="action-button boost" type="button" aria-label="ブーストで加速"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M18 3 6 19h10l-2 10 12-16H16z"/></svg><span>BOOST</span></button>
          <button id="attack-button" class="action-button attack" type="button" aria-label="弱点を攻撃"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="m24 3 5 0 0 5-16 15-5-5zM5 17l10 10M3 29l7-7"/></svg><span>ATTACK</span></button>
          <button id="wire-button" class="action-button wire" type="button" aria-label="ワイヤー接続・解除" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 29V17a8 8 0 0 1 16 0v3a5 5 0 0 1-10 0v-3M8 10V3M4 7l4-4 4 4"/></svg><span id="wire-label">WIRE</span></button>
        </div>
      </section>

      <section id="clear-screen" class="modal-card is-hidden" aria-live="assertive">
        <div class="clear-kicker">MISSION COMPLETE</div>
        <h1>STAGE CLEAR</h1>
        <p>空を切り拓いた。コイン <span id="clear-coins">0</span> 枚 / 巨人撃破。</p>
        <button id="retry-button" type="button">もう一度飛ぶ <span>↻</span></button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
